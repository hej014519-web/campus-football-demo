  --warn: #855e24; --warn-soft: #faf3e5; --warn-line: #e5d5b5;

/* StartLine controls: one button set, one tab row and one checkbox row for the workspace, the identity
   app and the event site (target structure §8.8, 4b-2). Loads after tokens.css and shell.css; app
   stylesheets add layout (width, alignment, wrapping) but not their own size, shape or colour.
   The identity app serves a byte-identical copy; keep both in step. */

/* Buttons: the default (also .secondary), .primary, .quiet and .danger. 44px tall, shared continuous corners, 14px text. */
.button {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; max-width: 100%; padding: 8px 16px;
  border: 1px solid var(--button-line); border-radius: var(--control-radius);
  background: var(--paper); color: var(--ink);
  font: inherit; font-size: 14px; font-weight: 600; line-height: 1.4;
  text-align: center; text-decoration: none; overflow-wrap: anywhere; cursor: pointer;
}
@media (any-hover: hover) and (any-pointer: fine) {
  :where(:root:not([data-ui-hover="false"])) .button:hover { background: var(--hover); color: var(--ink); text-decoration: none; }
}
.button.secondary { border-color: var(--button-line); background: var(--paper); color: var(--ink); }
@media (any-hover: hover) and (any-pointer: fine) {
  :where(:root:not([data-ui-hover="false"])) .button.secondary:hover { background: var(--hover); color: var(--ink); }
}
.button.primary { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
@media (any-hover: hover) and (any-pointer: fine) {
  :where(:root:not([data-ui-hover="false"])) .button.primary:hover { border-color: var(--accent-hover); background: var(--accent-hover); color: var(--on-accent); }
}
.button.quiet { border-color: transparent; background: transparent; color: var(--muted); }
@media (any-hover: hover) and (any-pointer: fine) {
  :where(:root:not([data-ui-hover="false"])) .button.quiet:hover { background: var(--hover); color: var(--ink); }
}
.button.danger { border-color: var(--danger-line); background: var(--paper); color: var(--danger); }
@media (any-hover: hover) and (any-pointer: fine) {
  :where(:root:not([data-ui-hover="false"])) .button.danger:hover { background: var(--danger-soft); color: var(--danger); }
}
.button:is(:disabled, [aria-disabled="true"]) {
  border-color: var(--line); background: var(--soft); color: var(--muted); cursor: not-allowed;
}
@media (any-hover: hover) and (any-pointer: fine) {
  :where(:root:not([data-ui-hover="false"])) .button:is(:disabled, [aria-disabled="true"]):hover {
  border-color: var(--line); background: var(--soft); color: var(--muted); cursor: not-allowed;
}
}
.button.small { padding: 8px 12px; font-size: 13px; }
.button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
/* A row of actions: 8px apart, wrapping on narrow screens. */
.button-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--control-gap); }

/* Tabs: a second row under a page title, inside dialogs and inside panels. The current tab is tinted;
   a row that must fit uses .fill (always) or .fill-phone (under 600px) to share the width instead of scrolling. */
.shell-tabs {
  display: flex; gap: 4px; width: fit-content; max-width: 100%; margin: 0 0 16px; padding: 4px;
  overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-panel); background: var(--paper); scrollbar-width: none;
}
.shell-tabs::-webkit-scrollbar { display: none; }
.shell-tabs.fill { width: 100%; }
.shell-tab {
  display: inline-flex; flex: none; align-items: center; justify-content: center; gap: 6px;
  min-width: 44px; min-height: 44px; padding: 8px 16px; border: 0; border-radius: var(--control-radius);
  background: transparent; color: var(--muted);
  font: inherit; font-size: 14px; font-weight: 600; line-height: 1.4; white-space: nowrap; text-decoration: none; cursor: pointer;
}
.shell-tabs.fill > .shell-tab { flex: 1 1 0; min-width: 0; padding-inline: 8px; white-space: normal; text-align: center; }
@media (any-hover: hover) and (any-pointer: fine) {
  :where(:root:not([data-ui-hover="false"])) .shell-tab:hover { background: var(--hover); color: var(--ink); text-decoration: none; }
}
.shell-tab:is([aria-current="page"], [aria-current="true"], [aria-selected="true"], [aria-pressed="true"]) { background: var(--accent-soft); color: var(--accent); }
@media (any-hover: hover) and (any-pointer: fine) {
  :where(:root:not([data-ui-hover="false"])) .shell-tab:is([aria-current="page"], [aria-current="true"], [aria-selected="true"], [aria-pressed="true"]):hover { background: var(--accent-soft); color: var(--accent); }
}
.shell-tab:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
.shell-tab small { color: inherit; font-size: 12px; font-weight: 400; opacity: .8; }
@media (max-width: 599px) {
  .shell-tab { padding-inline: 12px; }
  .shell-tabs.fill-phone { width: 100%; }
  .shell-tabs.fill-phone > .shell-tab { flex: 1 1 0; min-width: 0; padding-inline: 8px; white-space: normal; text-align: center; }
  /* Five tabs on a 320–390px screen: smaller text before a label wraps. */
  .shell-tabs:is(.fill, .fill-phone) > .shell-tab { padding-inline: 4px; font-size: 13px; }
}

/* Dropdowns draw the same caret in every app and theme. Local field rules often reset background and
   padding with shorthands, so the caret's own properties are kept here with !important. */
select:not([multiple], [size]) {
  appearance: none; -webkit-appearance: none; cursor: pointer;
  padding-right: var(--control-select-pad-right) !important;
  background-image: var(--control-select-icon) !important; background-position: var(--control-select-position) !important;
  background-repeat: no-repeat !important; background-size: var(--control-select-caret-width) var(--control-select-caret-width) !important;
}

label.check {
  display: flex; align-items: flex-start; gap: var(--control-gap); min-height: 44px; padding-block: 10px;
  line-height: 1.5; cursor: pointer;
}

  flex: none; width: 18px; height: 18px; min-height: 0; margin: 2px 0 0; padding: 0; accent-color: var(--accent);

/* Shared online data tables. The identity, event and registration runtimes serve
   this same file. Opt in with classes; printed sheets and editing grids keep
   their own layout. Domain styles own column widths, alignment and reflow. */
.ui-table {
  --ui-table-radius: var(--radius-panel, 18px);
  --ui-table-inner-radius: calc(var(--ui-table-radius) - 1px);
  --ui-table-line: var(--line, #e2e6ee);
  --ui-table-paper: var(--paper, #fff);
  --ui-table-head: var(--table-head, var(--soft, #f7f8fb));
  --ui-table-row-bg: var(--ui-table-paper);
  --ui-table-hover: var(--hover, var(--soft, #f7f8fb));
  --ui-table-padding-block: 12px;
  --ui-table-padding-inline: 16px;
  --ui-table-font-size: 14px;
  min-width: 0; max-width: 100%;
  border: 1px solid var(--ui-table-line);
  border-radius: var(--ui-table-radius);
  corner-shape: var(--corner-shape, superellipse(1.5));
  background: var(--ui-table-paper);
  color: var(--ink, #202738);
}
.ui-table-compact {
  --ui-table-padding-block: 10px;
  --ui-table-padding-inline: 12px;
  --ui-table-font-size: 13px;
}
/* A table with two-dimensional information scrolls within its existing wrapper.
   Reflowing lists can override overflow while retaining the shared frame. */
.ui-table-scroll { overflow: auto; overscroll-behavior-inline: contain; }
.ui-table-scroll:focus-visible { outline: 2px solid var(--focus, #596bb0); outline-offset: -2px; }
.ui-table-native {
  width: 100%; margin: 0; border-collapse: separate; border-spacing: 0;
  font-size: var(--ui-table-font-size); line-height: 1.6; text-align: left;
  font-variant-numeric: tabular-nums;
}
/* Low-specificity cell rules let domain-specific sticky columns, status colours
   and mobile card layouts override only the properties they need. */
.ui-table-native :where(th, td) {
  padding: var(--ui-table-padding-block) var(--ui-table-padding-inline);
  border: 0; border-bottom: 1px solid var(--ui-table-line);

  font-size: inherit;

  assert(number === '' || /^(?:00|0|[1-9][0-9]?)$/.test(number), '号码须为0、00或1至99，可暂时留空');
  const player = {name, number};
  for (const [key, label, max] of [['phone', '联系电话', 40], ['position', '位置', 40], ['note', '备注', 200]]) {
    if (owns(value, key)) {

  catch (error) { return {index, player: raw && typeof raw === 'object' ? copy(raw) : {name: clean(raw), number: ''}, status: 'error', message: error.message, warnings: []}; }
  const same = existing.find(item => nameKey(item.name) === nameKey(player.name) && clean(item.number) === player.number);
  if (same) return {index, player, status: 'duplicate', message: `${player.name}${player.number ? `（${player.number}号）` : ''}已在名单中或本次导入中，无需重复添加`, warnings: []};

    warnings: preview.rows.flatMap(row => row.warnings.map(message => ({playerName: row.player.name, message})))});
  next.revision = (Number.isSafeInteger(tournament.revision) ? tournament.revision : 0) + 1;
  return next;
}

Object.assign(exports,{normalizeRosterPlayer,previewRosterImport,applyRosterCommand});
},

 for(const m of [...t.matches]){const home=76+(Number(m.id.slice(1))%7),away=64+(Number(m.id.slice(1))%5);t=applyCommand(t,m.id,{type:'correct',home,away,reason:'预置示例成绩'},{actor:'示例赛务'});t=applyCommand(t,m.id,{type:'finish',override:true,reason:'预置示例成绩'},{actor:'示例赛务'});t=applyCommand(t,m.id,{type:'confirm'},{actor:'示例赛务'})}

  if(path==='/api/logout'){role='viewer';safeSet(ROLEKEY,role);updateBar();return response({ok:true})}

   else t=applyCommand(t,body.matchId,c,{actor:user().name});
   tournament=t;seen.add(body.requestId);audit.unshift({id:uuid(),actor:user().name,role,matchId:body.matchId,command:JSON.stringify(c),at:new Date().toISOString(),revision:t.revision});save();publish();return response(packet());
  }
  return response({error:'此预览仅提供本机示例功能，尚未连接正式服务器。'},404);
 }catch(e){return response({error:e.message},400)}
};
window.__previewExport=()=>URL.createObjectURL(new Blob([JSON.stringify({preview:true,notice:'示例数据，仅当前设备',tournament,audit},null,2)],{type:'application/json'}));

async function refresh(){accept(await request(publicSurface()?'/api/public/state':'/api/state'))}
function connect(){source?.close();const current=new EventSource(urlFor(publicSurface()?'/api/public/events':'/api/events'));source=current;current.onopen=()=>{if(source!==current)return;connected=true;render()};current.onmessage=e=>{if(source!==current)return;connected=true;accept(JSON.parse(e.data))};current.onerror=()=>{if(source!==current)return;connected=false;render()}}
async function prepareOffline(id=match()?.id){
 if(!offline||!user||!id||offlineCount()||!connected||!['scheduled','live'].includes(data?.tournament?.matches.find(x=>x.id===id)?.status))return;
 if(preparePromise)return preparePromise;
 preparePromise=(async()=>{const deviceId=await offline.deviceId(),p=await request('/api/offline/prepare',{matchId:id,deviceId});offlineRecord=await offline.prepare({packet:p,user,matchId:id,permit:p.offline});if(Number.isFinite(offlineRecord.serverOffset)){offset=offlineRecord.serverOffset;sessionStorage.setItem('sl-clock-offset',String(offset));}return offlineRecord;})();
 try{return await preparePromise;}finally{preparePromise=null;render()}
}
async function syncJournal(){if(syncPromise)return syncPromise;syncPromise=syncJournalNow();try{return await syncPromise}finally{syncPromise=null;}}
async function syncJournalNow(){
 if(!offlineCount())return data;if(!connected)throw Error('恢复服务器连接后再同步');
 const local=offlineRecord;
 try{const payload=await offline.replayPayload();offlineRecord=await offline.load();const d=await request('/api/offline/replay',payload);offlineRecord=await offline.markSynced(d);data=d;serverPacket=d;offset=d.serverTime-Date.now();render();if(['scheduled','live'].includes(d.tournament.matches.find(x=>x.id===local.matchId)?.status))await prepareOffline(local.matchId).catch(()=>toast('记录已保存到本机，请重新核对离线准备'));return d;}
 catch(e){if(e.status===409||e.status===403){const remote=e.data?.tournament?e.data:await request('/api/state').catch(()=>serverPacket);await offline.setConflict(remote||e.data,e.message);}else{await offline.releaseSync();if(e.status===401)navigate('/login');}offlineRecord=await offline.load();render();throw e;}
}
async function scoreJournal(command,id){
 if(!offline||storageError){if(!connected)throw Error('本机离线保存尚不可用，请先恢复连接');return null;}
 if(offlineCount()&&offlineRecord.matchId!==id)throw Error('请先同步当前场次的本地记录，再切换记分场次');
 if(!canLocal()&&connected&&!offlineCount())await prepareOffline(id);offlineRecord=await offline.recoverStaleSync(Date.now(),5000);
 if(!canLocal())throw Error('本场尚未完成离线准备，或授权需要重新核对');
 offlineRecord=await offline.record(command,{now:Date.now()+offset});
 const local=offlineRecord.packet;data=local;render();
 if(connected){try{return await syncJournal();}catch(e){if(!e.status){connected=false;toast('已保存在本机，恢复连接后同步');render();return local;}toast(e.message);return local;}}
 return local;
}
async function clearPending(){pending=null;sessionStorage.removeItem('sl-pending');if(offline&&!storageError){await offline.setPending(null);offlineRecord=await offline.load();}}
async function send(command,id=match()?.id){
 if(busy)throw Error('上一笔记录正在处理，请稍候再操作');if(pending)throw Error('请先核对上一笔操作结果');
 if(journalTypes.has(command.type)&&id&&offline&&!storageError){busy=true;try{return await scoreJournal(command,id)}finally{busy=false;render()}}
 if(offlineCount())throw Error('请先同步本地记分，再办理赛务管理操作');if(!connected)throw Error('管理操作需要连接服务器');busy=true;
 const req={command,matchId:id,revision:data.tournament.revision,requestId:Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('')};let sent=false;
 try{if(offline&&!storageError){await offline.remember({packet:data,user});await offline.setPending(req);}pending=req;sessionStorage.setItem('sl-pending',JSON.stringify(req));sent=true;const d=await request('/api/command',req);await clearPending();accept(d);return d;}
 catch(e){if(!sent||e.status){await clearPending().catch(()=>{pending=null;sessionStorage.removeItem('sl-pending');});if(e.data?.tournament)accept(e.data);}else connected=false;throw e;}
 finally{busy=false;render();}
}
async function retry(){if(!pending)return;try{const d=await request('/api/command',pending);await clearPending();accept(d);toast(d.duplicate?'原操作已保存，已完成核对':'操作已补交保存')}catch(e){if(e.status){await clearPending();if(e.data?.tournament)accept(e.data);render()}throw e}}
async function acquire(){if(!user||!isScore())return;try{await request('/api/lease',{matchId:match().id});lease=true;if(!offlineCount())await prepareOffline(match().id);render()}catch(e){lease=false;toast(e.message);render()}}

function scorer(){const m=match();if(!m)return shell('<div class="empty">场次不存在，请返回赛程。</div>','比赛记分','','');const writable=(connected&&lease||canLocal())&&['scheduled','live'].includes(m.status)&&!pending&&!offlineRecord?.conflict;document.documentElement.dataset.theme=localStorage.getItem('sl-console-theme')||'dark';const sideHtml=side=>{const id=side==='home'?m.homeId:m.awayId,t=team(id),f=m.fouls?.[side]||0;return `<section class="scoringteam"><div class="eyebrow">${side==='home'?'A · 主队':'B · 客队'}</div><h1 class="teamname">${esc(teamName(id))}</h1><div class="scorevalue num">${m.mode==='3x3'&&m.result?.winner===side?'W':m.score[side]}</div><div class="scorebuttons">${(m.mode==='3x3'?[1,2]:[1,2,3]).map(p=>btn(`+${p}`,'score','',`data-side="${side}" data-points="${p}" ${writable?'':'disabled'}`)).join('')}</div><div class="teamsub"><span class="stat">${m.mode==='3x3'?'全场':'本节'}犯规<b>${f}</b></span><span class="stat">已用暂停<b>${m.timeouts?.[side]||0}</b></span></div><div class="teamtools">${btn('犯规','foul','',`data-side="${side}" ${writable?'':'disabled'}`)}${btn('暂停','timeout','',`data-side="${side}" ${writable?'':'disabled'}`)}${btn('换人','sub','',`data-side="${side}" ${writable?'':'disabled'}`)}${m.mode==='3x3'?'':btn('球权 '+(m.possession===side?'◀':''),'possession','',`data-side="${side}" ${writable?'':'disabled'}`)}</div><details class="roster" ${selected[side]?'open':''}><summary>得分球员 · ${esc(t?.players?.find(p=>p.id===selected[side])?.name||'未指定')}</summary><div class="playergrid">${(t?.players||[]).map(p=>btn(`<b>${esc(p.number||'待补')}</b><span>${esc(p.name)}</span><small>${m.playerFouls?.[p.id]?.total||0}次犯规</small>`,'player',`playerchip ${selected[side]===p.id?'active':''}`,`data-side="${side}" data-player="${esc(p.id)}"`)).join('')||'<small>暂无名单，可记录球队得分</small>'}</div></details></section>`};return `<main class="full"><header class="fullhead">${link('← 赛程','/schedule')}<div class="brand"><i class="slash"></i>StartLine</div><div class="matchinfo"><strong>${esc(m.court)} · ${esc(m.id)}</strong><br><small>${m.mode==='3x3'?'三人制':'五人制'} · ${esc(m.ruleVersion||'赛前核定规则')}</small></div>${badge(m)}<span class="badge ${connected?'live':'warn'}">${offlineCount()?'本机待同步 '+offlineCount()+'笔':connected?'已保存到本机':canLocal()?'离线记分':'连接中断'}</span><span class="badge">${canLocal()?'离线已就绪':'预览仅本机'}</span><div class="actions">${btn('◐','theme','ghost','aria-label="切换主题"')}${link('投屏',`/screen/${m.id}`)}</div></header>${notice()}${!lease&&!canLocal()&&user&&['scheduled','live'].includes(m.status)?`<div class="notice sectiongap">当前为查看状态。${btn('取得本场记分权','acquire')}</div>`:''}${m.warnings?.length?`<div class="notice sectiongap">${m.warnings.map(esc).join(' · ')}</div>`:''}<div class="scoreboard">${sideHtml('home')}<section class="clockblock"><div class="period">${period(m)}</div><div class="gameclock num" data-gameclock>${fmt(clock(m).game)}</div>${btn(m.clock.running?'Ⅱ 停表':'▶ 启表','clock','clocktoggle primary',writable?'':'disabled')}<div class="eyebrow shotlabel">进攻时间</div><div class="shotclock num" data-shotclock>${Math.ceil(clock(m).shot/1000)}</div><div class="shottools">${btn(m.mode==='3x3'?'12″':'24″','shot','',`data-seconds="${m.mode==='3x3'?12:24}" ${writable?'':'disabled'}`)}${m.mode==='3x3'?'':btn('14″','shot','',`data-seconds="14" ${writable?'':'disabled'}`)}</div>${btn('校时 / 进攻表','timing','possession',writable?'':'disabled')}</section>${sideHtml('away')}</div><div class="consolebottom"><section class="panel"><div class="panelhead"><h2>最近记录</h2>${btn('撤销上一笔','undo','ghost',writable?'':'disabled')}</div><div class="compactevents">${events(m,15)}</div></section><section class="panel"><div class="panelhead"><h2>比赛处理</h2></div><div class="panelbody stack"><div class="actions">${m.status==='scheduled'?btn('开赛准备','prepare','primary',writable?'':'disabled'):btn('下一节 / 加时','nextperiod','',writable?'':'disabled')}${btn('提交比赛结果','finish','primary',writable?'':'disabled')}${user.role==='admin'&&m.status==='provisional'?btn('核定正式成绩','confirm','primary'):''}${btn('预览与离线说明','offlinestatus')}${btn('更多处理','more')}</div><p class="hint">记录员按裁判手势记录。犯规提示不代替现场判罚；罚球请用 +1 逐次记分。比赛表与进攻表可独立调整。</p><div><small>当前记录员</small> ${esc(user.name)}<br><small>${canLocal()?(connected?'已完成本场离线准备':'本机离线记分'):lease?'已取得本场控制权':'只读查看'} · 最近同步 ${new Date(lastSync).toLocaleTimeString('zh-CN',{hour12:false})}</small></div></div></section></div></main>`}
function screen(){document.documentElement.dataset.theme=localStorage.getItem('sl-console-theme')||'dark';const m=match();if(!data?.tournament)return `<main class="full screen"><div class="brand"><i class="slash"></i>StartLine</div><div class="empty"><h1>现场大屏暂未开放</h1><p class="subtitle">请由赛务在赛事设置中开启公开。</p>${link('工作人员登录','/login')}</div></main>`;return `<main class="full screen"><header class="fullhead"><div class="brand"><i class="slash"></i>StartLine</div><div class="matchinfo"><h2>${esc(data.tournament.name)}</h2><small>${m?esc(m.court):'篮球赛场'} · ${data.tournament.demo?'示例赛事':'现场比分'}</small></div><span class="dot ${connected?'':'off'}">${connected?'本机演示':'连接中断'}</span><div class="screen-actions actions">${btn('全屏','fullscreen','ghost')}${btn('◐','theme','ghost','aria-label="切换主题"')}${user?link('工作台','/live'):link('登录','/login')}</div></header>${notice()}${m?`<div class="screen-grid"><section><div class="period" style="text-align:center">${period(m)} · ${names[m.status]}</div><div class="screen-clock num" data-gameclock>${fmt(clock(m).game)}</div>${['home','away'].map((side,i)=>`<div class="screen-team"><div class="teammark ${i?'away':''}">${i?'B':'A'}</div><div><div class="teamname">${esc(teamName(i?m.awayId:m.homeId))}</div><small>球队犯规 ${m.fouls?.[side]||0} · 已用暂停 ${m.timeouts?.[side]||0}</small></div><strong class="scorevalue num">${m.mode==='3x3'&&m.result?.winner===side?'W':m.score[side]}</strong></div>`).join('')}<div class="screen-foot"><span>进攻 <b data-shotclock>${Math.ceil(clock(m).shot/1000)}</b> 秒</span><span>${m.status==='final'?'正式成绩':'场上比分 · 以赛后核定为准'}</span></div></section><aside class="screen-aside"><div class="eyebrow" style="margin-bottom:20px">小组积分 · 临时排名</div>${(data.standings||[]).map(g=>`<section class="sectiongap"><h3>${esc(g.group)}组</h3>${g.rows.map(r=>`<div class="listrow"><span class="rank ${r.rank<=2?'top':''}">${r.rank}</span><span class="grow">${esc(r.teamName||teamName(r.teamId))}</span><b>${r.points}</b></div>`).join('')}</section>`).join('')}<p class="hint sectiongap">只计入正式核定成绩</p></aside></div>`:'<div class="empty">赛程编排后显示比赛</div>'}</main>`}
function viewer(){document.documentElement.dataset.theme=localStorage.getItem('sl-theme')||'light';if(!data?.tournament)return `<main class="public-view"><div class="brand"><i class="slash"></i>StartLine</div><div class="empty"><h1>赛事暂未公开</h1><p class="subtitle">请等待赛务开启观众入口。</p></div></main>`;const tab=route()[1]||'live',t=data.tournament;let content;if(tab==='results')content=rankings();else if(tab==='schedule')content=`<section class="panel">${t.matches.map(m=>`<div class="listrow"><div class="grow"><strong>${esc(teamName(m.homeId))} — ${esc(teamName(m.awayId))}</strong><small>${esc(m.court)} · ${when(m.scheduledAt)}</small></div><span class="scoremini">${m.score.home}:${m.score.away}</span>${badge(m)}</div>`).join('')}</section>`;else content=`<div class="stack">${t.matches.filter(m=>m.status==='live'||m.status==='provisional').map(m=>`<section class="panel"><div class="panelhead"><span>${esc(m.court)}</span>${badge(m)}</div><div class="panelbody"><div class="versus"><div class="teamname">${esc(teamName(m.homeId))}</div><div class="bigscore num">${m.score.home}<span class="colon">:</span>${m.score.away}</div><div class="teamname">${esc(teamName(m.awayId))}</div></div><div class="clockline">${period(m)} · ${fmt(clock(m).game)}</div>${link('查看大屏',`/screen/${m.id}`)}</div></section>`).join('')||'<section class="panel empty">暂无进行中的比赛，可查看赛程与排名。</section>'}</div>`;return `<main class="public-view"><header class="public-head"><div><div class="brand"><i class="slash"></i>StartLine</div><h1>${esc(t.name)}</h1></div><span class="badge ${connected?'live':'warn'}">${connected?'实时比分':'离线 · 最后同步画面'}</span></header><nav class="toolbar public-tabs">${[['live','比分'],['schedule','赛程'],['results','排名']].map(([id,label])=>link(label,'/watch/'+id,tab===id?'primary':'')).join('')}</nav>${!connected?'<div class="notice">连接中断，当前显示最后同步的数据。</div>':''}${content}<p class="hint sectiongap">观众只读 · 场上比分以赛务核定的正式成绩为准</p></main>`}
function render(){if(!data)return;const p=route()[0]||'live';if(p==='watch')app.innerHTML=viewer();else if(p==='screen')app.innerHTML=screen();else if(p==='login'||!user){login();decorate();return;}else if(!data.tournament){app.innerHTML='<div class="empty">赛事读取失败，请重新登录。</div>';return}else if(p==='score')app.innerHTML=scorer();else{document.documentElement.dataset.theme=localStorage.getItem('sl-theme')||'light';const views={live,schedule,teams,results,settings,records};const allowed=user.role==='admin'||['live','schedule','results'].includes(p);app.innerHTML=(allowed?views[p]||live:live)()}decorate();}
function decorate(){for(const e of app.querySelectorAll('[data-icon]'))e.replaceChildren(icon(e.dataset.icon));for(const a of app.querySelectorAll('a[href^="/"]')){const path=a.getAttribute('href');if(a.hasAttribute('data-nav'))a.setAttribute('href',urlFor(path));else if(path==='/api/export')a.setAttribute('href',window.__previewExport());}}
function parseCSV(raw){const rows=[];let row=[],value='',quote=false;for(let i=0;i<raw.length;i++){const c=raw[i];if(c==='"'){if(quote&&raw[i+1]==='"'){value+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(value.trim());value=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&raw[i+1]==='\n')i++;row.push(value.trim());if(row.some(Boolean))rows.push(row);row=[];value=''}else value+=c}if(quote)throw Error('CSV引号未闭合');row.push(value.trim());if(row.some(Boolean))rows.push(row);return rows}
async function action(a,e){if(['editplayer','addplayer','importplayers','setup','public','confirm','correct','forfeit','reopen','reschedule','playoffs','clearplayoffs','tiebreak','roundrobin','addmatch','ai','connections'].includes(a)&&user?.role!=='admin')throw Error('此操作由赛务管理员办理');const m=match(),side=e.dataset.side;switch(a){
 case'close':dlg.close();return;case'expand':expanded=!expanded;render();return;case'filter':filter=e.dataset.value;render();return;
 case'account':modal('账号与外观',`<p>${esc(user.name)} · ${user.role==='admin'?'赛务管理员':'裁判 / 记录员'}</p><div class="actions">${btn('切换深浅主题','theme','', 'type="button"')}${btn('退出登录','logout','danger','type="button"')}</div>`,async()=>{});return;
 case'logout':if(offlineCount())throw Error('请先同步本地记录，或导出备份后交赛务处理');rosterUI.clear();if(offline)await offline.clear();offlineRecord=null;await request('/api/logout',{});dlg.close();user=null;lease=false;connect();navigate('/login');return;
 case'theme':{const key=isScore()||isScreen()?'sl-console-theme':'sl-theme',v=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.setItem(key,v);document.documentElement.dataset.theme=v;return}
 case'editplayer':rosterUI.edit(e.dataset.team,e.dataset.player);return;case'addplayer':rosterUI.open(e.dataset.team,'single');return;case'importplayers':rosterUI.open(e.dataset.team,'file');return;case'print':window.print();return;case'fullscreen':if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();return;
 case'reconnect':{const session=await request('/api/session');if(!session.user){navigate('/login');throw Error('请先重新登录，再核对本机记录');}user=session.user;connected=true;await refresh();connect();if(offlineCount())await syncJournal();else if(isScore())await acquire();toast('已重新连接');return;}
 case'sync':if(busy)throw Error('正在核对上一笔记录，请稍候');busy=true;try{await syncJournal();toast('本地记录已保存到本机')}finally{busy=false;render()}return;
 case'offlineexport':{if(!offline)throw Error('本机尚无离线记录');const backup=await offline.exportBackup();const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='StartLine-本机记分备份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('本机备份已导出');return;}
 case'compare':modal('待核对的服务器记录',`<p>本机保留 ${offlineCount()} 笔记录。请由赛务对照下方服务器比分，核对后再决定处理方式，系统不会覆盖任一份记录。</p><div class="hint">${esc(JSON.stringify(offlineRecord?.conflict?.serverPacket?.tournament?.matches?.find(x=>x.id===offlineRecord.matchId)?.score||serverPacket?.tournament?.matches?.find(x=>x.id===offlineRecord.matchId)?.score||{}))}</div>`,async()=>{});return;
 case'offlinestatus':modal('预览与离线说明',`<div class="stack"><p>当前为朋友体验版。操作只保存在这台设备的浏览器中，不会同步到其他手机、电脑或大屏。</p><p>正式版支持场馆局域网服务和提前准备后的离线记分。此预览不用于正式比赛，不模拟多设备断网同步。</p><p>拍照识别与 AI 接口在预览中未启用，可体验手动加入、粘贴和 CSV / XLSX 导入。</p></div>`,async()=>{});return;
 case'connections':modal('服务器与AI接入',`<div class="stack"><p>当前服务：<b>${esc(location.origin+BASE)}</b></p><p>公开地址：${esc(config.publicOrigin?config.publicOrigin+BASE:'尚未配置公网地址')}</p>${config.venueUrl?`<p>场馆私人服务器：<a class="btn" href="${esc(config.venueUrl)}">进入场馆服务</a></p>`:''}<p>AI：<b>${config.ai?.configured?'已配置 '+esc(config.ai.model):'尚未配置'}</b></p><p class="hint">服务器管理员可在部署环境文件中填写AI基础地址、协议、模型与密钥。支持本地Ollama或兼容接口；密钥只保存在服务器。</p><p class="hint">AI仅在赛务明确选择名单文字并确认发送时调用，计分和判罚独立运行。场馆与公网服务器各自的数据不会自动合并；同一场比赛应只在指定主服务器记分。</p></div>`,async()=>{});return;
 case'share':{const url=location.origin+location.pathname+'#/watch';modal('微信分享观众链接',`<p>复制以下链接发到微信，观众只看比分、赛程和排名。</p>${input('观众链接','url',url,'url',false)}<p class="hint">${location.hostname==='localhost'||location.hostname==='127.0.0.1'?'这是本机预览地址，发布后的HTTPS地址才可发给朋友。':'请在关闭VPN的微信真机中验证访问。此链接为朋友体验版，每个人看到和修改的是自己设备的示例数据。'}</p>`,async f=>{try{await navigator.clipboard.writeText(f.get('url'));toast('观众链接已复制')}catch{toast('请长按或全选上方链接复制')}});return;}
 case'acquire':await acquire();return;case'retry':await retry();return;
 case'player':selected[side]=selected[side]===e.dataset.player?null:e.dataset.player;render();return;
 case'score':await send({type:'score',side,points:Number(e.dataset.points),...(selected[side]?{playerId:selected[side]}:{})});toast(`${teamName(side==='home'?m.homeId:m.awayId)} +${e.dataset.points}`);return;
 case'possession':await send({type:'possession',side});return;
 case'clock':await send({type:'clock',action:m.clock.running?'stop':'start'});return;
 case'shot':await send({type:'shot',action:'reset',seconds:Number(e.dataset.seconds)});return;
 case'timeout':modal(`${teamName(side==='home'?m.homeId:m.awayId)} · 请求暂停`,`<p>记录本队一次暂停并停止比赛表。请在裁判准予后记录。</p>`,async()=>{await send({type:'timeout',side});toast('暂停已记录')});return;
