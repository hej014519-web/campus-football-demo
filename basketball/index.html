<script>
(()=>{
const root=document.getElementById('sl-basketball-design');
const content=root.querySelector('#sl-content');
const feedback=root.querySelector('#sl-feedback');
const iconGlyphs={"layout-dashboard": "▦", "clipboard-check": "✓", "calendar-days": "▤", "tablet": "▣", "smartphone": "▯", "chevrons-up-down": "↕", "flask-conical": "◇", "arrow-right": "→", "arrow-up-right": "↗", "check-circle-2": "✓", "file-check-2": "▤", "lock-keyhole": "▣", "clock-3": "◷", "undo-2": "↶", "git-branch": "⑂"};
const icon=(name)=>'<span class="sl-icon" aria-hidden="true">'+(iconGlyphs[name]||'·')+'</span>';
const heading=(eyebrow,title,sub,action='')=>'<div class="sl-heading"><div><div class="sl-eyebrow">'+eyebrow+'</div><h1>'+title+'</h1><p class="sl-subtitle">'+sub+'</p></div>'+action+'</div>';
const button=(text,action,primary=false,extra='')=>'<button class="sl-button cursor-interaction '+(primary?'sl-primary':'')+'" data-action="'+action+'" '+extra+'>'+text+'</button>';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page='overview',reviewTeam=0,returnOpen=false,scheduleEdit=false,schedulePreview=false,scheduleChanged=false,schedulePublished=false,publicTab='schedule',following=false;
const teamNames=['岭南理工','南海学院','海滨大学'];
const reviewStates=['待资格复核','待补充材料','待名单确认'];
const jerseys=['00','0','6','8','12','15','18','21','23','24','30','35'];
const names=['陈一','林二','周三','黄四','李五','吴六','郑七','何八','郭九','杨十','罗安','刘宁'];
let scheduleTime='17:00',publishedTime='17:00';
function scheduleEnd(){const [h,m]=scheduleTime.split(':').map(Number);const n=h*60+m+80;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
let selectedMode='5v5';
const modes={
  '5v5':{scores:[68,64],selected:[2,1],time:'06:24',period:'第3节',logs:[],history:[]},
  '3x3':{scores:[12,10],selected:[0,1],time:'03:18',period:'常规时间',logs:[],history:[]}
};
let prior=null;try{prior=JSON.parse(localStorage.getItem('startline-basketball-ui-v1'));}catch(e){}
if(prior&&['overview','review','schedule','scoring','public'].includes(prior.page))page=prior.page;
if(prior&&['5v5','3x3'].includes(prior.mode))selectedMode=prior.mode;
function saveState(){try{localStorage.setItem('startline-basketball-ui-v1',JSON.stringify({page:page,mode:selectedMode}));}catch(e){}}
function announce(text){feedback.textContent=text;}
function jump(next){page=next;announce('');render();saveState();}
function overview(){return heading('EVENT OPERATIONS','把每一场比赛，安排清楚。','乙A组赛事工作区 · 历史资料与演示操作',button('进入临场记录 '+icon('arrow-up-right'),'go-scoring',true))+
'<div class="sl-summary"><div><div class="sl-summary-label">男子 / 女子参赛队</div><div class="sl-summary-number">27 / 16<small>队 · 资料规模</small></div></div><div><div class="sl-summary-label">赛程场次</div><div class="sl-summary-number">95<small>场 · 待导入校核</small></div></div><div><div class="sl-summary-label">比赛模式</div><div class="sl-summary-number">5v5<small>3x3 独立规则模板</small></div></div></div>'+
'<div class="sl-overview-grid"><section class="sl-panel"><div class="sl-section-head"><h2>场次概览</h2><span class="sl-badge">2026.10.23 · 演示</span></div><div class="sl-match-list"><div class="sl-match"><div class="sl-match-time">14:00<small>一号场</small></div><div class="sl-match-names">岭南理工 × 南海学院<small>男子组 · 小组赛 · 第3节 06:24</small></div><div class="sl-match-score">68 : 64</div></div><div class="sl-match"><div class="sl-match-time">15:30<small>二号场</small></div><div class="sl-match-names">海滨大学 × 珠江学院<small>女子组 · 小组赛</small></div><span class="sl-badge sl-warn">待检录</span></div><div class="sl-match"><div class="sl-match-time">'+publishedTime+'<small>一号场</small></div><div class="sl-match-names">东城师范 × 西湾大学<small>男子组 · 小组赛</small></div><span class="sl-badge">未开赛</span></div></div>'+button('查看编排与赛程 '+icon('arrow-right'),'go-schedule',false,'style="margin-top:10px"')+'</section>'+
'<section class="sl-panel"><div class="sl-section-head"><h2>下一步办理</h2><span class="sl-note">演示待办</span></div><div class="sl-next-task"><p>3 支队伍需要核对</p><div class="sl-note">报名名单 → 资格 → 赛区确认</div>'+button('处理报名与资格','go-review')+'</div><div class="sl-next-task"><p>确认现场记录职责</p><div class="sl-note">记录员、计时员与复核分工</div>'+button('查看临场工作区','go-scoring')+'</div><div class="sl-next-task"><p>成绩经复核后公开</p><div class="sl-note">临场比分与正式结果分开展示</div>'+button('预览公众赛事页','go-public')+'</div></section></div>'+
'<div class="sl-pipeline"><span>资料整理</span><span>→</span><span>报名核验</span><span>→</span><span>名单采用</span><span>→</span><strong>赛程与现场</strong><span>→</span><span>成绩核定</span><span>→</span><span>归档</span></div>';}
function review(){const status=reviewStates[reviewTeam];return heading('ROSTER & ELIGIBILITY','报名与资格','先核资格，再从报名名单确认赛区名单。')+
'<div class="sl-review-grid"><div class="sl-team-options">'+teamNames.map((n,i)=>'<button class="sl-team-option cursor-interaction" data-team="'+i+'" aria-pressed="'+(i===reviewTeam)+'">'+n+'<small>男子组 · 演示队伍</small><span class="sl-badge '+(reviewStates[i]==='演示核验通过'?'sl-good':'sl-warn')+'">'+reviewStates[i]+'</span></button>').join('')+'</div><section class="sl-panel"><div class="sl-section-head"><h2>'+teamNames[reviewTeam]+'</h2><span class="sl-badge '+(status==='演示核验通过'?'sl-good':'sl-warn')+'">'+status+'</span></div><div class="sl-detail-count">18 人报名名单 → 12 人赛区确认名单 · 演示结构</div><div class="sl-checkline">'+icon('check-circle-2')+'<div>名单人数与号码核对<small>00 与 0 分别保留；赛区确认名单取自报名名单</small></div></div><div class="sl-checkline">'+icon('file-check-2')+'<div>资格证明材料<small>学籍、招生与参赛经历由授权审核人核验</small></div></div><div class="sl-checkline">'+icon('lock-keyhole')+'<div>确认后保留版本与修改记录<small>公开页仅展示获准公开的队伍与人员信息</small></div></div><div class="sl-row sl-between" style="margin-top:16px"><strong style="font-size:12px">赛区确认名单</strong><small>12 人 · 全部为虚构演示</small></div><div class="sl-roster">'+jerseys.map((j,i)=>'<span><b>'+j+'</b>'+names[i]+'</span>').join('')+'</div><div class="sl-row">'+button('通过本队核验','review-approve',true)+button('退回补充','review-return')+'</div>'+(returnOpen?'<div class="sl-return"><label for="sl-return-reason">退回原因</label><div class="sl-row" style="margin:6px 0">'+button('补充资格证明','reason-qualification')+button('核对确认名单','reason-roster')+'</div><textarea id="sl-return-reason" placeholder="填写具体需要补充的内容"></textarea><div class="sl-row" style="margin-top:8px">'+button('保存本地退回记录','review-return-save',true)+button('取消','review-return-cancel')+'</div></div>':'')+'</section></div>';}
function schedule(){return heading('DRAW & SCHEDULE','编排与赛程','2026.10.23 · 原赛程与修订草稿分开保留',button('预览赛程版本','schedule-preview',true))+
'<div class="sl-callout">'+icon(schedulePublished?'check-circle-2':'git-branch')+'<div>'+(schedulePublished?'已模拟发布 '+(scheduleChanged?'v2':'v1')+' · 仅此页面生效':scheduleChanged?'存在 1 项本地修订 · 尚未正式发布':'赛程版本 v1 · 演示工作副本')+'<div class="sl-note">调整先核对队伍、场地、时间及下游比赛影响</div></div></div><div class="sl-schedule-grid"><section class="sl-panel"><div class="sl-section-head"><h2>一号场</h2><span class="sl-note">男子小组赛</span></div><div class="sl-schedule-item"><div class="sl-row sl-between"><time>14:00 – 15:20</time><span class="sl-badge">记录中</span></div><p>岭南理工 × 南海学院</p><span class="sl-note">M-024 · 不对正在记录的比赛更换对阵</span></div><div class="sl-schedule-item"><div class="sl-row sl-between"><time>'+scheduleTime+' – '+scheduleEnd()+'</time><span class="sl-badge '+(scheduleChanged?'sl-warn':'')+'">'+(scheduleChanged?'本地修订':'未开赛')+'</span></div><p>东城师范 × 西湾大学</p><div class="sl-row sl-between"><span class="sl-note">M-027 · 演示场次</span>'+button('调整安排','schedule-edit')+'</div></div></section><section class="sl-panel"><div class="sl-section-head"><h2>二号场</h2><span class="sl-note">女子小组赛</span></div><div class="sl-schedule-item"><div class="sl-row sl-between"><time>15:30 – 16:50</time><span class="sl-badge sl-warn">待检录</span></div><p>海滨大学 × 珠江学院</p><span class="sl-note">W-012 · 演示场次</span></div><div class="sl-schedule-item"><div class="sl-row sl-between"><time>17:00 – 18:20</time><span class="sl-badge">未开赛</span></div><p>北岭大学 × 华南商学院</p><span class="sl-note">W-013 · 演示场次</span></div></section></div>'+
(scheduleEdit?'<section class="sl-panel" style="margin-top:16px"><h2>调整 M-027 的安排</h2><div class="sl-inline-form"><label>当前场地<input value="一号场" readonly></label><label for="sl-new-time">新开始时间<input id="sl-new-time" type="time" value="17:30"></label></div><div class="sl-note" style="margin-bottom:12px">演示冲突检查：本场预计 80 分钟，一号场 19:00 后不可用；开始时间须在 15:20 至 17:40 之间。</div><div class="sl-row">'+button('核对并应用本地修订','schedule-apply',true)+button('取消调整','schedule-cancel')+'</div></section>':'')+
(schedulePreview?'<section class="sl-print-preview"><div class="sl-section-head"><h2>发布预览 · '+(scheduleChanged?'v2':'v1')+'</h2><span class="sl-badge">本地模拟</span></div><p>M-027 · 东城师范 × 西湾大学 · 一号场 · '+scheduleTime+'</p><p class="sl-note" style="margin:7px 0 12px">正式系统将保留版本、发布人和通知回执；此处只演示页面状态。</p><div class="sl-row">'+button('模拟发布该版本','schedule-publish',true)+button('收起预览','schedule-preview-close')+'</div></section>':'');}
function scoring(){const s=modes[selectedMode];const is3=selectedMode==='3x3';return heading('COURTSIDE WORKSPACE','临场记录台','选队员 → 记得分 → 核对事件。现场计时器由独立职责操作。')+
'<div class="sl-tabs" aria-label="比赛模式">'+['5v5','3x3'].map(m=>'<button class="sl-tab cursor-interaction" data-mode="'+m+'" aria-pressed="'+(m===selectedMode)+'">'+m+' '+(m==='5v5'?'五人篮球':'三人篮球')+'</button>').join('')+'</div><section class="sl-score-stage"><div class="sl-score-meta"><span>'+selectedMode+' · 岭南理工 × 南海学院 · 演示记录单</span><span>本页本地状态 · 未核定</span></div><div class="sl-score-top"><div><div class="sl-team-name">岭南理工</div><div class="sl-team-label">主队 · 浅色</div><div class="sl-score-value">'+s.scores[0]+'</div></div><div><div class="sl-clock-label">记录用时刻</div><div class="sl-clock">'+s.time+'</div><div class="sl-period">'+s.period+'</div></div><div><div class="sl-team-name">南海学院</div><div class="sl-team-label">客队 · 深色</div><div class="sl-score-value">'+s.scores[1]+'</div></div></div><div class="sl-scoring-controls">'+[0,1].map(t=>'<div class="sl-team-control"><div class="sl-row sl-between"><strong style="font-size:12px">'+(t===0?'主队':'客队')+' · 选择队员</strong><span class="sl-note">#'+jerseys[s.selected[t]]+' '+names[s.selected[t]+(t===1?3:0)]+'</span></div><div class="sl-players">'+jerseys.slice(0,is3?4:5).map((j,i)=>'<button class="sl-player cursor-interaction" data-player="'+i+'" data-side="'+t+'" aria-pressed="'+(s.selected[t]===i)+'" aria-label="'+(t===0?'主':'客')+'队 '+j+' 号 '+names[i+(t===1?3:0)]+'">'+j+'<small>'+names[i+(t===1?3:0)]+'</small></button>').join('')+'</div><div class="sl-point-row '+(is3?'sl-two':'')+'">'+(is3?[1,2]:[1,2,3]).map(p=>'<button class="cursor-interaction" data-points="'+p+'" data-side="'+t+'" aria-label="'+(t===0?'主':'客')+'队所选球员加 '+p+' 分">+'+p+'</button>').join('')+'</div></div>').join('')+'</div><div class="sl-score-actions"><div class="sl-row">'+button(icon('undo-2')+' 撤销上一笔','score-undo',false,s.history.length?'':'disabled')+button(icon('clock-3')+' 修改记录时刻','score-time')+'</div><span class="sl-note">'+(is3?'1 / 2 分计分 · 12 秒参考':'1 / 2 / 3 分计分 · 24 秒参考')+'</span></div><div class="sl-score-log" aria-live="polite"><div class="sl-log-head">最近事件 · '+(s.logs.length?'本地记录':'演示初始状态')+'</div>'+(s.logs.length?s.logs.slice(-3).reverse().map(e=>'<div><time>'+e.time+'</time><span>'+e.text+'</span></div>').join(''):'<div><time>'+s.time+'</time><span>尚未添加本地事件，比分为虚构初始值</span></div>')+'</div><div id="sl-time-edit" hidden class="sl-form"><div class="sl-inline-form"><label for="sl-score-time-input">记录用比赛时刻<input id="sl-score-time-input" value="'+s.time+'" inputmode="numeric" placeholder="MM:SS"></label><label for="sl-period-input">比赛阶段<select id="sl-period-input">'+(is3?['常规时间','加时赛']:['第1节','第2节','第3节','第4节','加时赛']).map(x=>'<option '+(x===s.period?'selected':'')+'>'+x+'</option>').join('')+'</select></label></div>'+button('保存记录时刻','score-time-save')+'</div></section><p class="sl-technical-label">'+(is3?'3x3 为独立演示模板，不属于这份乙A组五人赛事赛程。':'5v5 为乙A组五人篮球设计方向。')+' 记录时刻不驱动现场钟；计分不自动构成正式成绩。</p>';}
function publicPage(){const s=modes['5v5'];return heading('PUBLIC EVENT PAGE','公众赛事页','手机优先 · 临场信息与核定成绩有清楚的状态。')+'<div class="sl-phone"><div class="sl-phone-head"><div class="sl-brand"><span class="sl-mark" aria-hidden="true"></span>StartLine<span style="font-size:10px;font-weight:400;margin-left:auto">演示赛事</span></div><p>第26届 · 乙A组</p><h2>广东省大学生<br>篮球联赛</h2><p>历史赛事资料 · 2026.10.23</p>'+button(following?'已关注本地演示':'关注这届赛事','public-follow')+'</div><div class="sl-phone-body"><div class="sl-row sl-between"><span style="font-size:12px;font-weight:600">临场比分</span><span class="sl-badge sl-warn">演示 · 未核定</span></div><div class="sl-public-score"><span>岭南理工<small>主队</small></span><strong>'+s.scores[0]+' : '+s.scores[1]+'</strong><span>南海学院<small>客队</small></span></div><div class="sl-tabs" aria-label="公众内容">'+[['schedule','赛程'],['standings','积分'],['details','本场记录']].map(([k,n])=>'<button class="sl-tab cursor-interaction" data-public-tab="'+k+'" aria-pressed="'+(publicTab===k)+'">'+n+'</button>').join('')+'</div>'+(publicTab==='schedule'?'<div class="sl-match"><div class="sl-match-time">15:30<small>二号场</small></div><div class="sl-match-names">海滨大学 × 珠江学院<small>女子小组赛 · 演示对阵</small></div></div><div class="sl-match"><div class="sl-match-time">'+publishedTime+'<small>一号场</small></div><div class="sl-match-names">东城师范 × 西湾大学<small>男子小组赛 · 演示对阵</small></div></div>':publicTab==='standings'?'<div class="sl-note" style="margin-bottom:8px">演示积分榜 · 仅示范正式结果口径</div><table class="sl-table"><thead><tr><th>名次</th><th>队伍</th><th>胜 / 负</th><th>积分</th></tr></thead><tbody><tr><td>1</td><td>岭南理工</td><td>2 / 0</td><td>4</td></tr><tr><td>2</td><td>南海学院</td><td>1 / 1</td><td>3</td></tr><tr><td>3</td><td>海滨大学</td><td>0 / 2</td><td>2</td></tr></tbody></table><p class="sl-note" style="margin-top:10px">当前未核定场次不计入此演示积分。</p>':'<div class="sl-note">'+s.period+' · 记录用时刻 '+s.time+'</div><div class="sl-score-log" style="color:var(--sl-ink)">'+(s.logs.length?s.logs.slice(-4).reverse().map(e=>'<div><span>'+e.time+'</span><span>'+e.text+'</span></div>').join(''):'<div>尚无本地新增事件</div>')+'</div>')+'<p class="sl-note" style="margin-top:18px;border-top:1px solid var(--sl-line);padding-top:12px">全部球队、人员与比分为虚构演示。<br>临场记录经核定后，方可发布正式成绩。</p></div></div>';}
const views={overview,review,schedule,scoring,public:publicPage};
function render(){content.innerHTML=views[page]();root.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.page){jump(b.dataset.page);return;}
 if(b.dataset.team!==undefined){reviewTeam=Number(b.dataset.team);returnOpen=false;render();announce('已选择 '+teamNames[reviewTeam]+' 的演示名单');return;}
 if(b.dataset.mode){selectedMode=b.dataset.mode;render();announce('已切换 '+selectedMode+'，两种模式分别保留本页记录');saveState();return;}
 if(b.dataset.player!==undefined){const s=modes[selectedMode];s.selected[Number(b.dataset.side)]=Number(b.dataset.player);render();return;}
 if(b.dataset.points){const s=modes[selectedMode],t=Number(b.dataset.side),p=Number(b.dataset.points),j=jerseys[s.selected[t]],n=names[s.selected[t]+(t===1?3:0)];s.history.push({scores:[...s.scores],logs:s.logs.map(x=>({...x}))});s.scores[t]+=p;s.logs.push({time:s.time,text:(t===0?'岭南理工':'南海学院')+' #'+j+' '+n+' +'+p+'分 · '+s.scores.join(':')});render();announce('已在本页记入 '+p+' 分，可撤销上一笔');return;}
 if(b.dataset.publicTab){publicTab=b.dataset.publicTab;render();return;}
 const a=b.dataset.action;if(!a)return;if(a.startsWith('go-')){jump(a.slice(3));return;}
 if(a==='review-approve'){reviewStates[reviewTeam]='演示核验通过';returnOpen=false;render();announce('已记录本队演示核验通过，未提交后台');}
 if(a==='review-return'){returnOpen=true;render();}
 if(a==='review-return-cancel'){returnOpen=false;render();}
 if(a==='reason-qualification')root.querySelector('#sl-return-reason').value='请补充可核验的学籍与参赛资格证明。';
 if(a==='reason-roster')root.querySelector('#sl-return-reason').value='请核对12人确认名单是否来自18人报名名单，并确认球衣号码。';
 if(a==='review-return-save'){const r=root.querySelector('#sl-return-reason');if(!r.value.trim()){announce('请填写退回原因');r.focus();return;}reviewStates[reviewTeam]='演示已退回';returnOpen=false;render();announce('已保存本地退回记录，未发送通知');}
 if(a==='schedule-edit'){scheduleEdit=true;schedulePreview=false;render();}
 if(a==='schedule-cancel'){scheduleEdit=false;render();}
 if(a==='schedule-apply'){const v=root.querySelector('#sl-new-time').value;if(v<'15:20'||v>'17:40'||!v){announce('新时刻与一号场现有比赛或开放时间冲突，请在15:20至17:40之间选择');return;}scheduleTime=v;scheduleChanged=v!=='17:00';scheduleEdit=false;schedulePublished=false;render();announce('已应用本地修订：M-027由17:00调整为'+scheduleTime+'，尚未正式发布');}
 if(a==='schedule-preview'){schedulePreview=true;scheduleEdit=false;render();}
 if(a==='schedule-preview-close'){schedulePreview=false;render();}
 if(a==='schedule-publish'){publishedTime=scheduleTime;schedulePublished=true;schedulePreview=false;render();announce('已模拟发布 '+(scheduleChanged?'v2':'v1')+'，未写入赛事后台或发送通知');}
 if(a==='score-undo'){const s=modes[selectedMode],last=s.history.pop();if(last){s.scores=last.scores;s.logs=last.logs;render();announce('已撤销本模式上一笔得分，恢复之前比分');}}
 if(a==='score-time'){const el=root.querySelector('#sl-time-edit');el.hidden=!el.hidden;}
 if(a==='score-time-save'){const v=root.querySelector('#sl-score-time-input').value.trim();if(!/^\d{1,2}:[0-5]\d$/.test(v)){announce('请输入有效的 MM:SS 时刻，例如06:24');return;}modes[selectedMode].time=v;modes[selectedMode].period=root.querySelector('#sl-period-input').value;render();announce('已更新记录用时刻，不控制现场计时器');}
 if(a==='public-follow'){following=!following;render();announce(following?'已关注本地演示赛事':'已取消本地演示关注');}
});
render();
})();
</script>
</body>
</html>
